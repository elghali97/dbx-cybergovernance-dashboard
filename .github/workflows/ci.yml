# Offline checks (no workspace credentials needed): generated files are up to date and Python compiles.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python compiles
        run: python -m py_compile src/*.py tools/*.py

      - name: Generated dashboard, Genie agent and Splunk app are up to date
        run: |
          python tools/build_dashboard.py
          python tools/build_genie.py
          python tools/build_splunk.py
          git diff --exit-code -- src/dashboards/ src/genie/ splunk/ || {
            echo "::error::Generated files are stale: run tools/build_dashboard.py, build_genie.py and build_splunk.py and commit the result."
            exit 1
          }

      - name: Splunk app package builds
        run: python tools/build_splunk.py --package --out /tmp/splunk-package && tar tzf /tmp/splunk-package/*.tar.gz | head

      - name: Every source table placeholder has a fallback
        run: |
          python - <<'PY'
          import re, sys
          sys.path.insert(0, "src")
          from refresh import OPTIONAL_SOURCES
          import glob
          used = {t for f in glob.glob("src/sql/*.sql") for t in re.findall(r"\$\{source:([\w.]+)\}", open(f).read())}
          missing = used - set(OPTIONAL_SOURCES)
          sys.exit(f"no fallback for {missing}" if missing else 0)
          PY
