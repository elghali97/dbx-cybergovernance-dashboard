              {
                "id": "cbde2df6a7c89370edc449dc5705d30c",
                "content": [
                  "You are the Databricks security posture analyst for the Cybersecurity team. All data comes from Databricks system tables (audit logs, Unity Catalog information_schema, lineage, compute and network tables) and is refreshed several times a day by the Security Posture job. The same data powers the \"Databricks Security Posture\" dashboard.\n",
                  "\n",
                  "Periods:\n",
                  "- \"This week\" = the current ISO week starting Monday (date_trunc('WEEK', current_date())). \"Last week\" = the previous complete Monday-Sunday week. If no period is given for activity questions, use the last 7 days and say so.\n",
                  "- weekly_activity_kpis gives one value per ISO week and metric (all workspaces); activity_kpis_daily gives the same metrics per day and workspace.\n",
                  "\n",
                  "Posture:\n",
                  "- Current findings are in security_findings_latest (one row per failing check and object; mention refreshed_at). check_results gives every check with status PASS / FAIL, findings and the check metadata. posture_score gives the score per category and overall (category = 'ALL'); score is between 0 and 1, score_pct between 0 and 100. posture_trend gives the daily history.\n",
                  "- Severity order is HIGH > MEDIUM > LOW: sort findings by severity_order then detected_at descending.\n",
                  "- When you recommend an action, quote the recommendation and give the documentation link (doc_url) and the best-practice link (best_practice_url) of the check. sat_reference is the closest Security Analysis Tool check id.\n",
                  "\n",
                  "Access and identities:\n",
                  "- grantee_type / owner_type / principal_type is USER (email), SERVICE_PRINCIPAL (application id UUID) or GROUP. is_broad_principal = TRUE means the grant targets every user (account users / users) and is a risk.\n",
                  "- For \"who has access to <table>\": use uc_grants where securable_name is the full table name OR its schema (catalog.schema) OR its catalog, because privileges are inherited; add the owner from securable_owners and explain the inheritance.\n",
                  "- For \"who accessed / read <table>\": use table_access_activity (lineage-based reads and writes per principal and day).\n",
                  "- identity_changes.is_privileged flags admin grants; exclude is_removal = TRUE when asked about grants.\n",
                  "\n",
                  "Data protection:\n",
                  "- A sensitive column (sensitive_columns) is protected when is_masked = TRUE or its table has has_abac_policy_in_scope = TRUE in table_governance_coverage.\n",
                  "- data_export_events contains only interactive (human) downloads and exports.\n",
                  "\n",
                  "Rules:\n",
                  "- Event tables and views have event_date: always filter on it.\n",
                  "- workspace_config_latest is reconstructed from audit log changes: say \"last known value\", not \"current value\".\n",
                  "- Never speculate beyond the data and never infer intent (for example compromise) from counts alone; if a query returns no rows, say that no evidence was found in system tables for the period.\n"
                ]
              }
            ],
            "example_question_sqls": [
              {
                "id": "1e0b9ad109b53905c1dd9680c002dff8",
                "question": [
                  "Summarise our security posture for last week"
                ],
                "sql": [
                  "WITH w AS (SELECT CAST(date_trunc('WEEK', current_date()) AS DATE) - 7 AS last_week)\n",
                  "SELECT s.category, s.score_pct, s.checks_failed, s.high_findings, s.medium_findings, s.low_findings,\n",
                  "       (SELECT score_pct FROM ${var.catalog}.${var.schema}.posture_trend t, w WHERE t.snapshot_date <= w.last_week ORDER BY t.snapshot_date DESC LIMIT 1) AS overall_score_pct_a_week_ago\n",
                  "FROM ${var.catalog}.${var.schema}.posture_score s\n",
                  "ORDER BY s.category = 'ALL' DESC, s.score_pct\n"
                ]
              },
              {
                "id": "24a67907ec1c47e05b10c4807e3e9b13",
                "question": [
                  "Which sensitive columns are not protected by a mask or an ABAC policy?"
                ],
                "sql": [
                  "SELECT s.table_full_name, s.column_name, s.classification, s.source, c.table_owner\n",
                  "FROM ${var.catalog}.${var.schema}.sensitive_columns s\n",
                  "LEFT JOIN ${var.catalog}.${var.schema}.table_governance_coverage c ON c.table_full_name = s.table_full_name\n",
                  "WHERE NOT s.is_masked AND NOT coalesce(c.has_abac_policy_in_scope, FALSE)\n",
                  "ORDER BY s.table_full_name, s.column_name\n"
                ]
              },
              {
                "id": "4886ca1ee35e734cdeb7a5ce58a7ba9c",
                "question": [
                  "Which security policies, classification tags or risky settings changed last week, and who changed them?"
                ],
                "sql": [
                  "WITH w AS (SELECT CAST(date_trunc('WEEK', current_date()) AS DATE) - 7 AS d)\n",
                  "SELECT 'Policy' AS change, event_time, workspace_name, actor, concat(policy_kind, ' ', action_name, ' ', coalesce(policy_name, '')) AS what\n",
                  "FROM ${var.catalog}.${var.schema}.policy_changes, w WHERE event_date >= w.d AND event_date < w.d + 7\n",
                  "UNION ALL\n",
                  "SELECT 'Classification tag', event_time, workspace_name, actor, concat(change_type, ' ', tag_name, ' on ', securable_name)\n",
                  "FROM ${var.catalog}.${var.schema}.tag_changes, w WHERE is_classification_tag AND event_date >= w.d AND event_date < w.d + 7\n",
                  "UNION ALL\n",
                  "SELECT 'Risky setting', event_time, workspace_name, actor, concat(setting_name, ' = ', setting_value)\n",
                  "FROM ${var.catalog}.${var.schema}.workspace_config_changes, w WHERE is_risky_value AND event_date >= w.d AND event_date < w.d + 7\n",
                  "ORDER BY event_time DESC\n"
                ]
              },
              {
                "id": "4ea5dfab57dbe7281fb8db37d7ae42a8",
                "question": [
                  "How did security activity change last week compared with the week before?"
                ],
                "sql": [
                  "WITH w AS (SELECT CAST(date_trunc('WEEK', current_date()) AS DATE) - 7 AS last_week)\n",
                  "SELECT k.metric_label,\n",
                  "       sum(CASE WHEN k.week_start = w.last_week THEN k.value ELSE 0 END) AS last_week,\n",
                  "       sum(CASE WHEN k.week_start = w.last_week - 7 THEN k.value ELSE 0 END) AS week_before\n",
                  "FROM ${var.catalog}.${var.schema}.weekly_activity_kpis k, w\n",
                  "GROUP BY k.metric_label, k.metric_order\n",
                  "ORDER BY k.metric_order\n"
                ]
              },
              {
                "id": "50043cb173bafc8dc8d8970be41c9905",
                "question": [
                  "List the HIGH severity findings and what to do about them"
                ],
                "sql": [
                  "SELECT check_id, title, workspace_name, object_type, object_name, detail, recommendation, doc_url, best_practice_url, refreshed_at\n",
                  "FROM ${var.catalog}.${var.schema}.security_findings_latest\n",
                  "WHERE severity = 'HIGH'\n",
                  "ORDER BY check_id, detected_at DESC\n"
                ]
              },
              {
                "id": "601e2084e65652723d0ac807a948a967",
                "question": [
                  "Which human users still authenticate with personal access tokens?"
                ],
                "sql": [
                  "SELECT principal, workspace_name, sum(events) AS pat_requests, max(event_date) AS last_seen\n",
                  "FROM ${var.catalog}.${var.schema}.auth_events_daily\n",
                  "WHERE auth_category = 'PAT' AND principal_type = 'USER' AND event_date >= current_date() - 30\n",
                  "GROUP BY principal, workspace_name\n",
                  "ORDER BY pat_requests DESC\n"
                ]
              },
              {
                "id": "625d77413e551a22edfb64213ab88504",
                "question": [
                  "Who was granted admin rights in the last 7 days?"
                ],
                "sql": [
                  "SELECT event_time, workspace_name, actor, action_name, target, group_name, assigned_permissions\n",
                  "FROM ${var.catalog}.${var.schema}.identity_changes\n",
                  "WHERE is_privileged AND NOT is_removal AND event_date >= current_date() - 7\n",
                  "ORDER BY event_time DESC\n"
                ]
              },
              {
                "id": "6ff50c2f511f567688bfc0ee4e0afe06",
                "question": [
                  "Which checks are failing?"
                ],
                "sql": [
                  "SELECT check_id, category, severity, title, findings, affected_workspaces, recommendation, doc_url\n",
                  "FROM ${var.catalog}.${var.schema}.check_results\n",
                  "WHERE status = 'FAIL'\n",
                  "ORDER BY severity_order, findings DESC\n"
                ]
              },
              {
                "id": "a05588a0f5142fffd8b8860d34a11098",
                "question": [
                  "Who has access to main.finance.transactions?"
                ],
                "sql": [
                  "SELECT g.securable_type AS granted_on, g.securable_name, g.grantee, g.grantee_type, g.privilege_type\n",
                  "FROM ${var.catalog}.${var.schema}.uc_grants g\n",
                  "WHERE g.is_direct AND g.securable_name IN ('main.finance.transactions', 'main.finance', 'main')\n",
                  "UNION ALL\n",
                  "SELECT 'OWNER', securable_name, owner, owner_type, 'OWNER'\n",
                  "FROM ${var.catalog}.${var.schema}.securable_owners WHERE securable_name = 'main.finance.transactions'\n"
                ]
              },
              {
                "id": "dbb844f4263574b1d2656f0956b5dbb9",
                "question": [
                  "Who exported or downloaded the most data this week?"
                ],
                "sql": [
                  "SELECT principal, workspace_name, export_channel, count(*) AS exports, max(event_time) AS last_export\n",
                  "FROM ${var.catalog}.${var.schema}.data_export_events\n",
                  "WHERE event_date >= date_trunc('WEEK', current_date())\n",
                  "GROUP BY principal, workspace_name, export_channel\n",
                  "ORDER BY exports DESC\n",
                  "LIMIT 20\n"
                ]
              },
              {
                "id": "eed30fd889ab2ec7906f12d06306e226",
                "question": [
                  "Which grants were given to all users in the last 30 days?"
                ],
                "sql": [
                  "SELECT event_time, workspace_name, actor, securable_type, securable_name, privilege, principal\n",
                  "FROM ${var.catalog}.${var.schema}.uc_permission_changes\n",
                  "WHERE change_type = 'GRANT' AND is_broad_principal AND event_date >= current_date() - 30 AND coalesce(status_code, 200) < 400\n",
                  "ORDER BY event_time DESC\n"
                ]
              }
            ]
          }
        }
