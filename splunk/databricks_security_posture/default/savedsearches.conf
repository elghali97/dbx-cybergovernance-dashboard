# Generated by tools/build_splunk.py - alerts on the live views of the Databricks Security Posture bundle.
# Disabled by default: enable them in Settings > Searches, reports, and alerts, and add an action (email, ...).
# Every 15 minutes over the last 45-60 minutes (audit events arrive ~10 minutes late); suppression on the listed
# fields avoids alerting twice on the same event / principal.

[Databricks - HIGH security signal]
description = Every HIGH signal of the live feed: admin rights granted, PAT without expiry, high privilege granted to all users, IP access list deleted, ABAC policy deleted, open-sharing token retrieved. One alert per event.
search = | databricksquery account_name="databricks" command_timeout=300 query="SELECT event_id, unix_timestamp(event_time) AS epoch, workspace_name, category, actor, action_name, target, detail, source_ip FROM security.security_posture.live_security_events WHERE event_date >= CAST(current_timestamp() - INTERVAL 1 DAY AS DATE) AND event_time >= current_timestamp() - INTERVAL 45 MINUTES AND signal = 'HIGH'" | eval _time=tonumber(epoch) | fields - epoch
disabled = 1
cron_schedule = */15 * * * *
enableSched = 1
dispatch.earliest_time = -1h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = event_id
alert.suppress.period = 2h
action.email.useNSSubject = 1

[Databricks - Failed authentication burst]
description = 20 or more failed authentications for the same principal and source IP within the last hour (brute force, leaked or expired credentials).
search = | databricksquery account_name="databricks" command_timeout=300 query="SELECT actor, source_ip, count(*) AS failures, array_join(slice(collect_set(detail), 1, 3), ' | ') AS errors, max(unix_timestamp(event_time)) AS epoch FROM security.security_posture.live_security_events WHERE event_date >= CAST(current_timestamp() - INTERVAL 1 DAY AS DATE) AND event_time >= current_timestamp() - INTERVAL 60 MINUTES AND category IN ('Authentication failure', 'IP access blocked') GROUP BY actor, source_ip HAVING count(*) >= 20" | eval _time=tonumber(epoch) | fields - epoch
disabled = 1
cron_schedule = */15 * * * *
enableSched = 1
dispatch.earliest_time = -1h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = actor,source_ip
alert.suppress.period = 2h
action.email.useNSSubject = 1

[Databricks - Mass interactive data export]
description = 20 or more interactive downloads / exports by the same person within the last hour (possible exfiltration).
search = | databricksquery account_name="databricks" command_timeout=300 query="SELECT actor, count(*) AS exports, count(DISTINCT target) AS objects, array_join(slice(collect_set(detail), 1, 5), ', ') AS channels, max(unix_timestamp(event_time)) AS epoch FROM security.security_posture.live_security_events WHERE event_date >= CAST(current_timestamp() - INTERVAL 1 DAY AS DATE) AND event_time >= current_timestamp() - INTERVAL 60 MINUTES AND category = 'Data export' GROUP BY actor HAVING count(*) >= 20" | eval _time=tonumber(epoch) | fields - epoch
disabled = 1
cron_schedule = */15 * * * *
enableSched = 1
dispatch.earliest_time = -1h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = actor
alert.suppress.period = 2h
action.email.useNSSubject = 1

[Databricks - Denied data access burst]
description = 50 or more denied Unity Catalog / SQL requests by the same principal within the last hour (probing, privilege escalation attempts or a broken pipeline).
search = | databricksquery account_name="databricks" command_timeout=300 query="SELECT principal, count(*) AS attempts, count(DISTINCT securable_name) AS securables, array_join(slice(collect_set(securable_name), 1, 5), ', ') AS sample_securables, max(unix_timestamp(event_time)) AS epoch FROM security.security_posture.live_access_denied_events WHERE event_date >= CAST(current_timestamp() - INTERVAL 1 DAY AS DATE) AND event_time >= current_timestamp() - INTERVAL 60 MINUTES GROUP BY principal HAVING count(*) >= 50" | eval _time=tonumber(epoch) | fields - epoch
disabled = 1
cron_schedule = */15 * * * *
enableSched = 1
dispatch.earliest_time = -1h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = principal
alert.suppress.period = 2h
action.email.useNSSubject = 1
