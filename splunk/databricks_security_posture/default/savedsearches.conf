# Generated by tools/build_splunk.py - alerts on the live views of the Databricks Security Posture bundle.
# Disabled by default: enable them in Settings > Searches, reports, and alerts, and add an action (email, ...).
# Every 15 minutes over the last 45-60 minutes (audit events arrive ~10 minutes late); suppression on the listed
# fields avoids alerting twice on the same event / principal.

[Databricks - HIGH security signal]
description = Every HIGH signal of the live feed: admin rights granted, PAT without expiry, high privilege granted to all users, IP access list deleted, ABAC policy deleted, open-sharing token retrieved or recipient without IP access list, account admin change, host security alert. One alert per event.
search = | databricksquery account_name="databricks" command_timeout=300 query="SELECT event_id, unix_timestamp(event_time) AS epoch, workspace_name, category, actor, action_name, target, detail, source_ip FROM security.security_posture.live_security_events WHERE event_date >= CAST(current_timestamp() - INTERVAL 1 DAY AS DATE) AND event_time >= current_timestamp() - INTERVAL 45 MINUTES AND signal = 'HIGH'" | eval _time=tonumber(epoch) | fields - epoch
disabled = 1
cron_schedule = */15 * * * *
enableSched = 1
dispatch.earliest_time = -1h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = event_id
alert.suppress.period = 2h
action.email.useNSSubject = 1

[Databricks - Behavioural detection (SRA)]
description = One alert per principal and window above a detection rule (detection_rules): repeated failed logins, IP access list failures, repeated access to secrets, repeated unauthorized Unity Catalog / data requests, potential privilege escalation, download / destructive / read-write bursts, access to 5+ workspaces. Field detection_id names the rule.
search = | databricksquery account_name="databricks" command_timeout=300 query="SELECT concat(detection_id, '|', principal, '|', CAST(unix_timestamp(window_start) AS STRING)) AS alert_key, detection_id, title, severity, principal, workspaces, events, distinct_objects, array_join(slice(objects, 1, 10), ', ') AS objects, sample, array_join(source_ips, ', ') AS source_ips, sra_query, unix_timestamp(window_start) AS epoch FROM security.security_posture.live_security_detections WHERE event_date >= current_date() - 1 AND window_end >= current_timestamp() - INTERVAL 75 MINUTES AND detection_id <> 'PRINT_STATEMENTS'" | eval _time=tonumber(epoch) | fields - epoch
disabled = 1
cron_schedule = */15 * * * *
enableSched = 1
dispatch.earliest_time = -1h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = alert_key
alert.suppress.period = 24h
action.email.useNSSubject = 1

[Databricks - Sensitive operation]
description = One alert per sensitive operation: Terms of Service, account settings and admins, Databricks support access, global init scripts, DBFS mounts, libraries on all clusters, open-sharing recipients without IP access list, recipient token lifetime, IP-denied sharing queries, host security alerts. Field operation names the type.
search = | databricksquery account_name="databricks" command_timeout=300 query="SELECT event_id, operation, severity, workspace_name, actor, target, detail, source_ip, unix_timestamp(event_time) AS epoch FROM security.security_posture.live_sensitive_operations WHERE event_date >= CAST(current_timestamp() - INTERVAL 1 DAY AS DATE) AND event_time >= current_timestamp() - INTERVAL 45 MINUTES" | eval _time=tonumber(epoch) | fields - epoch
disabled = 1
cron_schedule = */15 * * * *
enableSched = 1
dispatch.earliest_time = -1h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = event_id
alert.suppress.period = 2h
action.email.useNSSubject = 1
