# Databricks Security Posture — dashboard, Genie agent and refresh job built only on system tables.
# Deployment settings live in config.yml; this file only wires the bundle together.
# The bundle deploys the refresh job; the job's publish task creates the dashboard and the Genie agent once the
# tables exist (Genie refuses to create an agent over tables that do not exist yet).
bundle:
  name: security_posture
  databricks_cli_version: ">= 1.3.0"
  engine: direct

include:
  - config.yml
  - resources/*.yml

targets:
  # Production install: active refresh schedule. Default target of the workspace Deploy button, deploy.sh and the
  # GitHub Actions workflow. Files are deployed to the deployer's home folder (not /Workspace/Shared) because the
  # refresh job runs that code with the deployer's identity: nobody else must be able to modify it.
  prod:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  # Personal trial / development copy: resources are prefixed with your name, the refresh schedule is
  # paused, and data goes to a separate schema so it never collides with prod.
  dev:
    mode: development
    variables:
      schema: security_posture_dev
      name_prefix: "[dev ${workspace.current_user.short_name}] "
